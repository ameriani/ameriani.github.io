<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alessandra Meriani</title>
    <meta
      name="description"
      content="Academic portfolio of Alessandra Meriani — statistician and PhD candidate at the University of Bologna."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" id="skip-link" href="#main">Skip to content</a>

    <header class="masthead">
      <img
        class="portrait"
        id="portrait"
        src="assets/profile.jpg"
        alt="Alessandra Meriani"
        width="88"
        height="88"
      />
      <div class="masthead__identity">
        <h1 class="site-name" id="site-name">Alessandra Meriani</h1>
        <p class="site-role" id="site-role">Statistician · PhD Candidate</p>
        <p class="site-affiliations" id="site-affiliations"></p>
      </div>
      <div class="masthead__controls">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="btn-en" aria-pressed="true">EN</button>
          <button type="button" id="btn-it" aria-pressed="false">IT</button>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Dark mode">
            Theme
          </button>
        </div>
        <nav class="quick-links" aria-label="Profile links">
          <a id="link-cv" href="#" hidden>CV</a>
          <a id="link-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
          <a id="link-email" href="mailto:alessandra.meriani2@unibo.it">Email</a>
          <a id="link-unibo" href="#" target="_blank" rel="noopener">UniBo</a>
        </nav>
      </div>
    </header>

    <nav class="site-nav" aria-label="Sections">
      <a id="nav-about" href="#about">About</a>
      <a id="nav-research" href="#research">Research</a>
      <a id="nav-news" href="#news">News</a>
      <a id="nav-work" href="#work">Selected work</a>
      <a id="nav-contact" href="#contact">Contact</a>
    </nav>

    <main class="main" id="main">
      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
        <div id="about-body"></div>
      </section>
      <section id="research" aria-labelledby="research-title">
        <h2 id="research-title">Research interests</h2>
        <div id="research-body"></div>
      </section>
      <section id="news" aria-labelledby="news-title">
        <h2 id="news-title">News</h2>
        <div id="news-body"></div>
      </section>
      <section id="work" aria-labelledby="work-title">
        <h2 id="work-title">Selected work</h2>
        <div id="work-body"></div>
      </section>
      <section id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Contact</h2>
        <div id="contact-body"></div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
